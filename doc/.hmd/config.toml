# Vault configuration for doc/.
#
# The presence of this directory marks doc/ as the vault, so that HQL reads the
# issues, the proposals and the trackers as cards for the generated views in
# status/ (see status/README.md, "Generated views").
#
# The namespace root is the vault itself, the default of `location_path`, so
# the setting is not written. HQL reads `cards` from that root, not from the
# whole vault, so anything narrower hides issues/, proposals/ and status/ from
# those views.
#
# The site uses this same namespace root. HyperMarkDown cards opt into
# publication individually with `nav.visibility: public`.
