        file: "0025-extend-shared-test-coverage.hmd"
      - id: "0021"
        title: "Specify the vault directory and the standard's boundary"
        file: "0021-specify-the-vault-directory-and-its-boundary.hmd"
      - id: "0008"
        title: "A public card linking to a private one needs a policy"
        file: "0008-private-card-link-policy.hmd"
      - id: "0007"
        title: "Conversion should name its output target"
        file: "0007-conversion-target-dialect.hmd"
      - id: "0101"
        title: "Live-editing behaviours are only checked by hand"
        file: 0101-live-preview-checks-unautomated.hmd
      - id: "0102"
        title: "Diagrams render on a white surface in every theme"
        file: 0102-diagram-theme-surface.hmd
      - id: "0106"
        title: "There is no way to search the wiki from the preview"
        file: 0106-search-the-wiki-from-the-preview.hmd
    todo:
      - id: "0019"
