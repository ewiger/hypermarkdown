name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      # Pinned to the exact release, not to `@v9`. `astral-sh/setup-uv` ships
      # `v9.0.0` but maintains no moving `v9` tag — its floating majors stop at
      # `v7` — so the shorthand every other action accepts fails here with
      # "unable to find version", before a single step runs. Check that a
      # floating tag exists before shortening this.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # `uv sync` with no flags is the whole install. The repository root is a
      # uv workspace root rather than a project, so it has no extras of its own
      # for `--all-extras` to act on; the `dev` dependency group in the root
      # `pyproject.toml` names `hypermarkdown[mkdocs,dev]` and uv installs that
      # group by default.
      #
      # `--locked` rather than a bare sync: it fails if `uv.lock` does not match
      # the workspace instead of quietly re-resolving, so a dependency change
      # has to arrive as a committed lockfile. That is the whole point of having
      # one — every run installs the versions a human approved, and an upgrade
      # is a diff someone can point at rather than whatever the index served
      # that morning.
      - name: Install
        run: uv sync --locked

      # Both roots of the suite: `tools/hmd/tests`, the Python tool's own, and
      # `tests/`, the repository guards that build the real site. `testpaths` in
      # the root `pyproject.toml` names them, so this stays argument-free.
      - name: Test
        run: uv run python -m pytest

      # Dogfooding gates from HMD-0001 §10: both trees MUST lint clean. The
      # roots are named explicitly so the gates do not depend on marker
      # discovery, and the fixture is deliberately not run under --strict —
      # it carries exactly one expected warning, the red link in glossary/.
      - name: Lint doc/wiki
        run: uv run hmd lint --root doc/wiki --strict

      - name: Lint the example fixture
        run: uv run hmd lint --root examples/small

      - name: Lint the sorting example
        run: uv run hmd lint --root examples/cs-alg-sorting --strict

      # D2 renders through its own binary. It comes from the pinned
      # `hypermarkdown-toolchain` release and nowhere else (issue 0107): one
      # version, digest-checked against `toolchain.json`, identical here, in the
      # docs deploy and inside the VS Code extension. Without it diagrams would
      # still build — they degrade to a labelled placeholder — but the rendered
      # path would go untested, which is the path that can break.
      - name: Install the pinned toolchain
        run: node scripts/toolchain.mjs --github-path

      - name: Check d2
        run: d2 --version

      # The second consumer of the resolver (HMD-0002). A build that goes red
      # here means the model works for lint but not for rendering.
      - name: Build the wiki
        run: uv run mkdocs build --strict

  # The TypeScript implementation (HMD-0020, HMD-0021). It runs independently of the
  # Python matrix so neither half can block the other's merge, and it installs
  # Python anyway: the conformance gate below is only meaningful when it can
  # ask the canonical implementation what the right answer is.
  js:
    name: typescript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Pinned exactly, for the reason spelled out in the `test` job above:
      # there is no floating `v9` tag to fall back on.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: |
          npm ci
          uv sync --locked

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Runs the shared corpus and the parity check that shells out to
      # `hmd lint`. A drift between the two implementations fails here.
      #
      # `HMD_REQUIRE_PARITY` turns the parity suite's "no Python, skip" branch
      # into a failure. That branch is right on a contributor's machine and
      # wrong here, where the job installs Python precisely so the canonical
      # implementation can be asked: without this, anything that stops `hmd`
      # from running — a moved project file, a broken install — retires the
      # only cross-implementation gate the project has, and the job still
      # reports green.
      - name: Test
        run: npm test
        env:
          HMD_REQUIRE_PARITY: "1"

      - name: Package the extension
        run: npm run -w tools/hmd-vsc-ext package

      - uses: actions/upload-artifact@v4
        with:
          name: hmd-vsc-ext
          path: tools/hmd-vsc-ext/*.vsix
          if-no-files-found: error

  # The same build `release.yml` runs, minus the upload. Packaging breaks in
  # ways the test matrix cannot see — an editable install resolves through
  # `src/` and never exercises the entry points — and PyPI will not let a
  # filename be replaced, so the place to find a bad wheel is on the pull
  # request.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      # `--package`, never a bare `uv build`. The root is a workspace root with
      # no `[project]` table, and a bare `uv build` there does not fail — it
      # builds an empty `unknown-0.0.0` and reports success.
      - name: Build
        run: uv build --package hypermarkdown

      - name: Check the metadata
        run: uvx twine check --strict dist/*

      # Deliberately *not* installed from `uv.lock`. This step exists to
      # exercise what a stranger gets from `pip install hypermarkdown[mkdocs]`,
      # so it resolves fresh against the published ranges — which is the only
      # place a bad bound shows up before a user finds it.
      - name: Install the wheel and smoke-test it
        run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install "$(ls dist/*.whl)[mkdocs]"
          cd /tmp
          /tmp/smoke/bin/hmd --version
          /tmp/smoke/bin/python -c "
          from importlib.metadata import entry_points
          eps = entry_points(group='mkdocs.plugins')
          # Both keys, because the retained 'hyper-markdown' alias is the one
          # compatibility promise made to mkdocs.yml files we do not own. If it
          # ever stops resolving, a stranger's site build breaks, not ours.
          for key in ('hypermarkdown', 'hyper-markdown'):
              assert eps[key].load().__name__ == 'HyperMarkDownPlugin', key
          print('mkdocs plugin entry points resolve under both keys')
          "
