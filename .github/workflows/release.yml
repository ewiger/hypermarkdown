name: Release

# Publication to PyPI, driven by a tag. `workflow_dispatch` exists so the whole
# path — build, metadata check, install, smoke test — can be exercised without
# minting a tag, and so a dry run can be pointed at TestPyPI first. A tag is the
# only thing that reaches PyPI proper.
#
# `v[0-9]*`, not `v*`: each tool carries its own version and its own tag, and the
# extension's is `vsc-ext-vX.Y.Z`. That also begins with a `v`, so the looser
# glob would fire this workflow on an extension release — building a Python
# distribution nobody asked for and failing the tag check on the way.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Where to publish this build
        type: choice
        default: nowhere
        options: [nowhere, testpypi]

permissions:
  contents: read

# Never cancel a publication in flight. A half-uploaded release is worse than a
# queued one, and PyPI refuses to overwrite a file it has already accepted.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      # The tag is a promise about the contents of the archive. Checking it here
      # turns a mistyped tag into a red build instead of a wrong version on PyPI
      # that can never be replaced — PyPI does not allow re-uploading a filename.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged=$(uv run --no-project python -c "
          import pathlib, re
          source = pathlib.Path('tools/hmd/src/hypermarkdown/__init__.py').read_text()
          print(re.search(r'__version__ = \"([^\"]+)\"', source).group(1))
          ")
          echo "tag=$tagged packaged=$packaged"
          if [ "$tagged" != "$packaged" ]; then
            echo "::error::tag v$tagged does not match __version__ $packaged" >&2
            exit 1
          fi

      # `--package`, never a bare `uv build`. The repository root is a uv
      # workspace root with no `[project]` table of its own, and a bare
      # `uv build` there builds an empty `unknown-0.0.0` distribution and exits
      # zero. On this path that artifact would pass `twine check` and travel as
      # far as PyPI will take it, so the flag is what makes a layout mistake
      # loud instead of publishable.
      - name: Build
        run: uv build --package hypermarkdown

      # `twine check --strict` reads the metadata the way PyPI will, which is
      # the difference between finding a broken long description now and finding
      # it after the upload succeeded.
      - name: Check the metadata
        run: uvx twine check --strict dist/*

      # Install the wheel into a clean environment, away from the source tree,
      # so nothing resolves through `src/` by accident. The entry point and the
      # MkDocs plugin registration are the two things that only exist once the
      # package is installed, so they are what a build check has to touch.
      - name: Install the wheel and smoke-test it
        run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install "$(ls dist/*.whl)[mkdocs]"
          cd /tmp
          /tmp/smoke/bin/hmd --version
          /tmp/smoke/bin/python -c "
          from importlib.metadata import entry_points
          eps = entry_points(group='mkdocs.plugins')
          # Both keys, because the retained 'hyper-markdown' alias is the one
          # compatibility promise made to mkdocs.yml files we do not own. If it
          # ever stops resolving, a stranger's site build breaks, not ours.
          for key in ('hypermarkdown', 'hyper-markdown'):
              assert eps[key].load().__name__ == 'HyperMarkDownPlugin', key
          print('mkdocs plugin entry points resolve under both keys')
          "

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hypermarkdown
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A dry run of a version already uploaded should not fail the workflow.
          skip-existing: true

  pypi:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hypermarkdown
    # Trusted publishing: the job proves its identity to PyPI with a short-lived
    # OIDC token, so there is no API token in repository secrets to leak or
    # rotate. It requires a matching publisher configured on PyPI first — owner
    # `ewiger`, repository `hypermarkdown`, workflow `release.yml`,
    # environment `pypi` — and fails with a 403 until that exists.
    #
    # A publisher is pinned to all four of those and follows none of them when
    # they change. The 2026-08-10 repository rename invalidated the original
    # outright, which is a failure that surfaces only here, after a green build.
    # Re-registered against the new repository and the new project name.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: github release
    needs: pypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The one job that writes to the repository, and it writes only the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Notes come from the changelog rather than from generated commit titles:
      # the changelog is the edited account, and the commit log is the raw one.
      # `tools/hmd/CHANGELOG.md`, not the root one — a tag releases the Python
      # tool, and the root file is only an index of the three tools' changelogs.
      - name: Cut the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Title, Latest flag, and body all follow scripts/release.py, the one
          # place the repository's release rules live.
          python3 scripts/release.py notes "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$(python3 scripts/release.py title "$GITHUB_REF_NAME")" \
            --latest="$(python3 scripts/release.py latest "$GITHUB_REF_NAME")" \
            --notes-file notes.md
