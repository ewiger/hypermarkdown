name: Release hmd-semantics

# Publication of `hypermarkdown-semantics` to PyPI, driven by a `semantics-v*`
# tag. The tool is its own uv project under `tools/hmd-semantics/`, outside the
# root workspace so that `torch` stays out of the root lock, so it is built and
# tested from that directory and never with `--package` from the root.
on:
  push:
    tags: ["semantics-v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-semantics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/hmd-semantics
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      # PyPI never accepts a filename twice, so a mistyped tag must fail here.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/semantics-v')
        run: |
          tagged="${GITHUB_REF_NAME#semantics-v}"
          packaged=$(uv run --no-project python -c "
          import pathlib, re
          source = pathlib.Path('src/hypermarkdown_semantics/__init__.py').read_text()
          print(re.search(r'__version__ = \"([^\"]+)\"', source).group(1))
          ")
          echo "tag=$tagged packaged=$packaged"
          if [ "$tagged" != "$packaged" ]; then
            echo "::error::tag semantics-v$tagged does not match __version__ $packaged" >&2
            exit 1
          fi

      - name: Test
        run: uv run python -m pytest -q

      - name: Build
        run: uv build --out-dir ../../dist

      - name: Check the metadata
        run: uvx twine check --strict ../../dist/*

      - name: Install the wheel and smoke-test it
        run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install "$(ls ../../dist/*.whl)"
          cd /tmp
          /tmp/smoke/bin/hmd-semantics --help

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/semantics-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hypermarkdown-semantics
    # Trusted publishing, as for `hypermarkdown`: the publisher on PyPI is owner
    # `ewiger`, repository `hypermarkdown`, workflow `release-semantics.yml`,
    # environment `pypi`.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: github release
    needs: pypi
    if: startsWith(github.ref, 'refs/tags/semantics-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Cut the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py notes "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$(python3 scripts/release.py title "$GITHUB_REF_NAME")" \
            --latest="$(python3 scripts/release.py latest "$GITHUB_REF_NAME")" \
            --notes-file notes.md
