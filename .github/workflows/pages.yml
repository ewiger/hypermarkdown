name: Pages

# Publication, deliberately not a job inside `ci.yml`. That workflow cancels
# runs in progress, which is right for a test matrix and wrong for a deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

# What `deploy-pages` needs. `id-token` is not optional: it authenticates to
# the Pages API by OIDC rather than with `GITHUB_TOKEN`.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one that has started — a half-uploaded
# artifact is a broken site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      # From the lockfile, so the published site is built from the same versions
      # the tests ran against. No `--extra`: the root is a uv workspace root
      # rather than a project, and its `dev` group already asks for
      # `hypermarkdown[mkdocs,dev]`, which is the same resolution CI installs. A deploy that resolved freshly could differ from
      # a green CI run on nothing but an upstream release, which is how issue
      # 0003 reached the site in the first place.
      - name: Install
        run: uv sync --locked

      # Diagrams degrade to a labelled placeholder without this, which would
      # publish quietly wrong pages rather than failing — so the deploy needs
      # the same engine the tests get, which means the same pinned
      # `hypermarkdown-toolchain` release CI installs (issue 0107). These lines
      # used to be a copy of CI's; now both call one script over one pin, so the
      # site cannot be built with a different d2 than the one CI tested.
      - name: Install the pinned toolchain
        run: node scripts/toolchain.mjs --github-path

      - name: Check d2
        run: d2 --version

      # The same gate `ci.yml` gets. Nothing is published that does not build
      # clean, so `--strict` stays on here rather than being relaxed for the
      # sake of shipping something.
      - name: Build
        run: uv run mkdocs build --strict

      # The built tree never enters git. It is uploaded as a Pages artifact and
      # served from the CDN, which is why this repository has no `gh-pages`
      # branch and `site/` stays ignored.
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
