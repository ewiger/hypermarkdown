name: Release (VS Code extension)

# Publication of `hypermarkdown.hmd` to the VS Marketplace and to Open
# VSX, driven by a tag. The extension carries its own version, so it carries its
# own tag prefix: `vsc-ext-vX.Y.Z` here, `vX.Y.Z` for the Python tool in
# `release.yml`. Neither triggers the other.
#
# Both registries publish automatically. Open VSX authenticates with a stored
# `OVSX_PAT`; the Marketplace authenticates with no stored credential at all —
# an OIDC `azure/login` and `vsce --azure-credential`, see the block above
# `marketplace:`.
#
# `workflow_dispatch` runs the whole build — gates, tag-free — and publishes
# nowhere, so the packaging path can be exercised without minting a tag.
on:
  push:
    tags: ["vsc-ext-v*"]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a publication in flight. Both registries refuse to overwrite a
# version they have already accepted, so a half-finished release is worse than a
# queued one.
concurrency:
  group: release-vsc-ext-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Python is here for the same reason it is in CI's `js` job: the parity
      # suite asks the canonical implementation what the right answer is, and a
      # release is the last place to skip the only cross-implementation gate the
      # project has.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: |
          npm ci
          uv sync --locked

      # The tag is a promise about the contents of the VSIX. Checking it here
      # turns a mistyped tag into a red build instead of a wrong version on a
      # listing — the marketplace will not let a version be republished.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/vsc-ext-v')
        run: |
          tagged="${GITHUB_REF_NAME#vsc-ext-v}"
          packaged=$(node -p "require('./tools/hmd-vsc-ext/package.json').version")
          echo "tag=$tagged packaged=$packaged"
          if [ "$tagged" != "$packaged" ]; then
            echo "::error::tag vsc-ext-v$tagged does not match version $packaged" >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          HMD_REQUIRE_PARITY: "1"

      # One VSIX per VS Code target platform, each carrying the `d2` for that
      # platform from the pinned `hypermarkdown-toolchain` release (issue 0107).
      # This is what makes diagrams work on a fresh install: the extension
      # downloads nothing and runs no container, so the binary has to be in the
      # package, and a binary in the package means the package is not portable.
      #
      # All six are cross-packaged here on Linux. `vsce --target` only writes
      # the target into the manifest and the filename; the bytes it bundles are
      # whatever is in `toolchain/`, which is why the staging step below names
      # the toolchain platform explicitly rather than letting the script detect
      # this runner's.
      #
      # The `windows-arm64` target takes the x86_64 binary deliberately — the
      # toolchain publishes no windows-arm64 archive and Windows runs it under
      # emulation, which is the same trade VS Code itself ships.
      - name: Package
        run: |
          set -euo pipefail
          targets="linux-x64:linux-x86_64 linux-arm64:linux-arm64
                   darwin-x64:macos-x86_64 darwin-arm64:macos-arm64
                   win32-x64:windows-x86_64 win32-arm64:windows-x86_64"
          mkdir -p dist-vsix
          for pair in $targets; do
            vscode_target="${pair%%:*}"
            toolchain_platform="${pair##*:}"
            echo "::group::$vscode_target ($toolchain_platform)"
            rm -rf tools/hmd-vsc-ext/toolchain
            # `--dest` resolves against the repository root, so this path means
            # the same thing whichever directory the step is standing in.
            node scripts/toolchain.mjs \
              --platform "$toolchain_platform" \
              --dest tools/hmd-vsc-ext/toolchain
            # `vsce` packages the directory it is run from. `--no` runs the
            # version in the lockfile and fails rather than fetching one, for
            # the same reason the Open VSX job does.
            (cd tools/hmd-vsc-ext && npx --no vsce package \
              --no-dependencies \
              --target "$vscode_target" \
              --out "../../dist-vsix/hmd-$vscode_target.vsix")
            echo "::endgroup::"
          done
          rm -rf tools/hmd-vsc-ext/toolchain
          ls -l dist-vsix

      # Every VSIX must actually contain the binary it promises. A `.vscodeignore`
      # edit or a staging step that silently no-ops would otherwise ship a
      # package that renders no diagrams and says nothing about why — the exact
      # failure this issue exists to remove, moved one layer down.
      - name: Check every VSIX carries its d2
        run: |
          set -euo pipefail
          for vsix in dist-vsix/*.vsix; do
            case "$vsix" in
              *win32*) expected="extension/toolchain/bin/d2.exe" ;;
              *)       expected="extension/toolchain/bin/d2" ;;
            esac
            if ! unzip -l "$vsix" | grep -q "$expected"; then
              echo "::error::$vsix does not contain $expected" >&2
              unzip -l "$vsix" >&2
              exit 1
            fi
            echo "ok $vsix → $expected"
          done

      # `vsce` rewrites relative links in the packaged README against the
      # repository root and ignores `repository.directory`, so a `../../doc/…`
      # link ships as a 404 on the listing. Nothing else catches it: the file
      # renders correctly on GitHub and wrongly in the gallery.
      - name: Check the packaged README has no rewritten links
        run: |
          unzip -o -d /tmp/vsix dist-vsix/hmd-linux-x64.vsix >/dev/null
          if grep -q 'blob/HEAD/\.\.' /tmp/vsix/extension/readme.md; then
            echo "::error::README.md has relative links that vsce rewrote into 404s" >&2
            grep -n 'blob/HEAD/\.\.' /tmp/vsix/extension/readme.md >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist-vsix/*.vsix
          if-no-files-found: error

  # Published with no stored credential: a federated OIDC token, exchanged for
  # an Entra token, spent on the gallery by `vsce --azure-credential`.
  #
  # This was a PAT job for one day, and a skipped `--oidc` job before that. The
  # wait for Marketplace trusted publishing ended without the feature —
  # microsoft/vsmarketplace#1422 has been open since August 2025, the gallery
  # exposes no policy UI, and `--oidc` is in no released `vsce`. The PAT that
  # replaced it never published anything: two runs died on
  # `Request timeout: /_apis/gallery`, and global PATs — the "all accessible
  # organizations" scope the Marketplace requires — stop working 2026-12-01
  # anyway. Neither path is coming back.
  #
  # What was actually blocking `--azure-credential` was authorisation, not
  # tooling. `vsce` builds a `ChainedTokenCredential` and asks it for the Azure
  # DevOps scope — a well-known public resource id, not a secret — and the
  # gallery answers `InvalidAccessException` unless *that* principal is a member
  # of the publisher. The grant is by Azure DevOps **profile id** — not a client
  # id, object id, or resource id — and is a browser step on the publisher's
  # Members page, once per identity. The human user was granted Contributor on
  # 2026-09-14 and published `0.2.0 darwin-arm64` by hand in seconds; this app
  # registration is a different principal and carries its own grant.
  #
  # `azure/login@v2` rather than the environment variables directly:
  # `EnvironmentCredential`, first in the chain, does not read
  # `AZURE_FEDERATED_TOKEN_FILE`, so the federated token never reaches it.
  # `azure/login` performs the OIDC `az login` itself and `AzureCliCredential`,
  # next in the chain, picks the session up. Microsoft documents only the Azure
  # Pipelines path, via a user-assigned managed identity; from GitHub the app
  # registration is federated directly and no managed identity exists.
  #
  # `allow-no-subscriptions` because publishing touches no Azure resource — the
  # app is an identity, not a tenant role, and has no subscription to select.
  #
  # The federated credential is bound to subject
  # `...:environment:vscode-marketplace`, so the token can only be minted by a
  # job running in that environment. `environment:` below is therefore
  # load-bearing, not just a deployment label.
  #
  # The subject is the **immutable** form, `repo:<owner>@<owner_id>/<repo>@<repo_id>`.
  # This repository has `use_immutable_subject` on, so that is what GitHub
  # actually presents; a credential registered against the plain
  # `repo:<owner>/<repo>` spelling is never matched and Entra answers
  # `AADSTS700213: No matching federated identity record`. Both spellings are
  # registered on the app, so the setting can be flipped either way without a
  # dead pipeline. `gh api repos/<owner>/<repo>/actions/oidc/customization/sub`
  # reports which one is live.
  marketplace:
    name: publish to the VS Marketplace
    needs: build
    if: startsWith(github.ref, 'refs/tags/vsc-ext-v')
    runs-on: ubuntu-latest
    # `id-token: write` is what lets the job ask GitHub for the OIDC token
    # `azure/login` exchanges. Without it the login fails before `vsce` runs.
    permissions:
      contents: read
      id-token: write
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=hypermarkdown.hmd
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix/

      # `--no` runs the `vsce` in the lockfile and fails rather than fetching
      # one — the reasoning the Open VSX job spells out, and it holds here for
      # the same reason: this job is past every gate, and what is on the line is
      # a version number no registry will let us reuse. Bare `npx vsce` would
      # also resolve the *deprecated standalone* `vsce` package rather than
      # `@vscode/vsce`, which is a different tool several majors behind.
      #
      # The artifacts from `build`, not a fresh package: packaging again here
      # would ship bytes no gate ran against, and would put different bytes in
      # the gallery than the ones on the GitHub release and Open VSX.
      #
      # Every platform-specific VSIX in one invocation (issue 0107). The gallery
      # treats them as one version with several builds and each client installs
      # the one matching its platform; uploading only some would strand the rest
      # of the platforms on the previous version.
      #
      # `--skip-duplicate` because a release can now be half-published and has
      # to be re-runnable. 0.2.0 reached Open VSX and not the gallery; a re-run
      # that died on the registry already holding the version would leave no way
      # forward but a version bump nobody needed.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # No `VSCE_PAT`: `--azure-credential` and a PAT are mutually exclusive and
      # `vsce` errors when both are present, so leaving the secret in the
      # environment would break this step rather than back it up.
      - name: Publish
        run: npx --no vsce publish --no-dependencies --skip-duplicate --azure-credential --packagePath vsix/*.vsix

  openvsx:
    name: publish to Open VSX
    needs: build
    if: startsWith(github.ref, 'refs/tags/vsc-ext-v')
    runs-on: ubuntu-latest
    # Where Cursor, Windsurf, and VSCodium install from. The namespace is taken
    # from `publisher` in the packaged manifest, not from anything here, and it
    # has to exist before the first publish — `ovsx create-namespace`, once, by
    # hand. `hypermarkdown` already does; `hyper-markdown` never did, which is
    # what this job named until the rename.
    environment:
      name: open-vsx
      url: https://open-vsx.org/extension/hypermarkdown/hmd
    steps:
      - uses: actions/checkout@v7

      # 24, where `build` above stays on 20. Same split as `release-ts-core.yml`:
      # the build matches CI so it tests what CI tested, and the publish job
      # takes the current runtime — it compiles nothing, and 20 is deprecated on
      # GitHub's runners.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix/

      # `--no` is what makes this deterministic, and it is the opposite of the
      # `vsce` line above. `ovsx` is a devDependency in the lockfile, so the
      # `npm ci` above already put the pinned version on the path; `--no` runs
      # that one and *fails* rather than falling back to a registry download.
      # Bare `npx` would silently fetch the latest if the dependency were ever
      # dropped from the manifest — in the one job that is past every gate,
      # where a failure burns a version number no registry will let us reuse.
      # `vsce` needs the explicit version for the mirror-image reason: the
      # prerelease carrying `--oidc` is deliberately not in the lock.
      # Every platform-specific VSIX, for the same reason as the Marketplace
      # job above: one version, one build per target.
      - name: Publish
        run: npx --no ovsx publish --skip-duplicate --packagePath vsix/*.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  github-release:
    name: github release
    needs: [marketplace, openvsx]
    # A skipped `needs` skips its dependents too, so a bare `startsWith` would
    # silently take the release down with the Marketplace job — and the release
    # is where the VSIX for the manual upload comes from, which makes it the one
    # job that must survive. `always()` re-enables evaluation; the two result
    # checks then keep the old meaning: Open VSX must have published, and the
    # Marketplace job must not have *failed* — skipped is fine, broken is not.
    if: >-
      always()
      && startsWith(github.ref, 'refs/tags/vsc-ext-v')
      && needs.openvsx.result == 'success'
      && needs.marketplace.result != 'failure'
    runs-on: ubuntu-latest
    # The one job that writes to the repository, and it writes only the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix/

      # Notes come from the extension's changelog rather than from generated
      # commit titles: the changelog is the edited account. `tools/hmd-vsc-ext/`,
      # not the root one — the root file is the language's.
      - name: Cut the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#vsc-ext-v}"
          python3 -c "
          import pathlib, re
          text = pathlib.Path('tools/hmd-vsc-ext/CHANGELOG.md').read_text()
          section = re.search(
              r'^## \[$version\][^\n]*\n(.*?)(?=^## |\Z)', text, re.S | re.M
          )
          pathlib.Path('notes.md').write_text((section.group(1) if section else '').strip())
          " || true
          [ -s notes.md ] || echo "See tools/hmd-vsc-ext/CHANGELOG.md for what changed." > notes.md
          gh release create "$GITHUB_REF_NAME" vsix/*.vsix \
            --title "hypermarkdown.hmd $version" \
            --notes-file notes.md
